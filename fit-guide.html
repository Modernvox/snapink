  <script>
    (() => {
      const opener = document.getElementById('fit-guide-open');
      const dialog = document.getElementById('fit-guide-viewer');
      const stage = document.getElementById('fit-guide-zoom-stage');
      const image = document.getElementById('fit-guide-zoom-image');
      const closeButton = document.getElementById('fit-guide-viewer-close');
      const zoomIn = document.getElementById('fit-guide-zoom-in');
      const zoomOut = document.getElementById('fit-guide-zoom-out');
      if (!opener || !dialog || !stage || !image || !closeButton) return;

      let fitScale = 1;
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let lastTrigger = null;
      let lastTapAt = 0;
      const pointers = new Map();
      let gesture = null;
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const maxZoom = () => Math.max(1, Math.min(5, 1536 / (1536 * fitScale)));
      const clampPan = () => {
        const width = image.naturalWidth * fitScale * zoom;
        const height = image.naturalHeight * fitScale * zoom;
        panX = clamp(panX, -Math.max(0, (width - stage.clientWidth) / 2), Math.max(0, (width - stage.clientWidth) / 2));
        panY = clamp(panY, -Math.max(0, (height - stage.clientHeight) / 2), Math.max(0, (height - stage.clientHeight) / 2));
      };
      const render = () => {
        const width = image.naturalWidth || 1536;
        const height = image.naturalHeight || 1024;
        fitScale = Math.min(stage.clientWidth / width, stage.clientHeight / height);
        image.style.width = `${width * fitScale * zoom}px`;
        image.style.left = `calc(50% + ${panX}px)`;
        image.style.top = `calc(50% + ${panY}px)`;
      };
      const resetView = () => {
        zoom = 1;
        panX = 0;
        panY = 0;
        render();
      };
      const setZoomAt = (nextZoom, clientX, clientY) => {
        const bounds = stage.getBoundingClientRect();
        const centerX = bounds.left + bounds.width / 2;
        const centerY = bounds.top + bounds.height / 2;
        const localX = (clientX - centerX - panX) / zoom;
        const localY = (clientY - centerY - panY) / zoom;
        zoom = clamp(nextZoom, 1, maxZoom());
        panX = clientX - centerX - localX * zoom;
        panY = clientY - centerY - localY * zoom;
        clampPan();
        render();
      };
      opener.addEventListener('click', () => {
        lastTrigger = opener;
        dialog.showModal();
        resetView();
        closeButton.focus();
      });
      closeButton.addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => {
        pointers.clear();
        gesture = null;
        if (lastTrigger?.isConnected) lastTrigger.focus();
      });
      zoomIn.addEventListener('click', () => setZoomAt(zoom * 1.5, stage.getBoundingClientRect().left + stage.clientWidth / 2, stage.getBoundingClientRect().top + stage.clientHeight / 2));
      zoomOut.addEventListener('click', () => setZoomAt(zoom / 1.5, stage.getBoundingClientRect().left + stage.clientWidth / 2, stage.getBoundingClientRect().top + stage.clientHeight / 2));
      stage.addEventListener('pointerdown', event => {
        event.preventDefault();
        stage.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 1) {
          gesture = { type: 'pan', x: event.clientX, y: event.clientY, panX, panY };
        } else if (pointers.size >= 2) {
          const [first, second] = [...pointers.values()];
          const midX = (first.x + second.x) / 2;
          const midY = (first.y + second.y) / 2;
          gesture = {
            type: 'pinch',
            distance: Math.hypot(first.x - second.x, first.y - second.y),
            zoom,
            localX: (midX - stage.getBoundingClientRect().left - stage.clientWidth / 2 - panX) / zoom,
            localY: (midY - stage.getBoundingClientRect().top - stage.clientHeight / 2 - panY) / zoom
          };
        }
      });
      stage.addEventListener('pointermove', event => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size >= 2 && gesture?.type === 'pinch') {
          const [first, second] = [...pointers.values()];
          const distance = Math.hypot(first.x - second.x, first.y - second.y);
          const midX = (first.x + second.x) / 2 - stage.getBoundingClientRect().left - stage.clientWidth / 2;
          const midY = (first.y + second.y) / 2 - stage.getBoundingClientRect().top - stage.clientHeight / 2;
          zoom = clamp(gesture.zoom * distance / Math.max(1, gesture.distance), 1, maxZoom());
          panX = midX - gesture.localX * zoom;
          panY = midY - gesture.localY * zoom;
          clampPan();
          render();
        } else if (pointers.size === 1 && gesture?.type === 'pan' && zoom > 1) {
          panX = gesture.panX + event.clientX - gesture.x;
          panY = gesture.panY + event.clientY - gesture.y;
          clampPan();
          render();
        }
      });
      const endPointer = event => {
        const point = pointers.get(event.pointerId);
        if (!point) return;
        const wasTap = gesture?.type === 'pan' && Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) < 8;
        pointers.delete(event.pointerId);
        if (wasTap && zoom === 1) {
          const now = Date.now();
          if (now - lastTapAt < 350) setZoomAt(2, event.clientX, event.clientY);
          lastTapAt = now;
        }
        if (pointers.size === 1) {
          const [remaining] = [...pointers.entries()];
          gesture = { type: 'pan', x: remaining[1].x, y: remaining[1].y, panX, panY };
        } else if (!pointers.size) gesture = null;
      };
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', endPointer);
      stage.addEventListener('wheel', event => {
        event.preventDefault();
        setZoomAt(zoom * (event.deltaY < 0 ? 1.15 : 1 / 1.15), event.clientX, event.clientY);
      }, { passive: false });
      window.addEventListener('resize', () => {
        if (dialog.open) {
          clampPan();
          render();
        }
      });
      image.addEventListener('load', () => { if (dialog.open) render(); });
    })();
  </script>
