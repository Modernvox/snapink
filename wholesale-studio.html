<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Wholesale Studio | SnapInk</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/mobile-navigation.css"><script defer src="/mobile-navigation.js"></script><style>
body{background:#090909;color:#f6f3eb}.wholesale-studio{width:min(1500px,calc(100% - 24px));margin:20px auto 60px}.wholesale-studio header,.studio-config,.studio-colors,.studio-save{padding:18px;margin:14px 0;border:1px solid var(--si-line);border-radius:10px;background:var(--si-panel)}.wholesale-studio a{color:var(--si-accent)}.wholesale-studio select{display:block;min-height:44px;margin-top:6px;padding:8px;background:#111;color:#fff;border:1px solid #555;border-radius:5px}.studio-config{display:flex;align-items:center;gap:9px}.color-chip{display:inline-block;width:28px;height:28px;border:1px solid #aaa;border-radius:50%}.studio-colors{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:6px 20px}.studio-colors p{margin:4px}.studio-save{display:flex;align-items:center;justify-content:space-between;gap:14px}.studio-save button{min-height:48px;padding:10px 20px;background:var(--si-accent);color:#111;font-weight:800;border:0;border-radius:5px}.studio-save button:disabled{opacity:.5}@media(max-width:700px){.studio-colors{grid-template-columns:1fr}.studio-save{align-items:stretch;flex-direction:column}}
