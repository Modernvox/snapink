<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><meta name="robots" content="noindex,nofollow"><title>Partner Portal | SnapInk™</title><style>body{margin:0;background:var(--si-bg);color:var(--si-text);font:16px system-ui,sans-serif}.wrap{width:min(680px,calc(100% - 36px));margin:12vh auto}.brand{display:inline-flex;align-items:center}.brand img{display:block;width:min(180px,48vw);height:auto}h1{font-size:clamp(38px,8vw,68px);line-height:.98;letter-spacing:-.05em;margin:60px 0 18px}p{color:var(--si-muted);line-height:1.7}.box{margin-top:30px;padding:24px;border:1px solid var(--si-line);background:var(--si-panel)}#embroidery-download{display:none;margin-top:12px}#embroidery-download:not([hidden]){display:inline-block}a{color:var(--si-accent)}button{display:inline-block;padding:14px 18px;background:var(--si-button);color:#fff;text-decoration:none;font-weight:700;border:0;cursor:pointer}#message{min-height:22px;color:var(--si-accent);font-size:14px}input{display:block;width:100%;box-sizing:border-box;padding:13px;background:var(--si-bg);border:1px solid var(--si-line);color:white;margin:12px 0;font:inherit}</style><link rel="stylesheet" href="/mobile-navigation.css?v=20261029-header1"><script defer src="/mobile-navigation.js"></script><link rel="stylesheet" href="/site-theme.css?v=20261029-header1">  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head><body><main class="wrap"><a class="brand" href="/" aria-label="SnapInk home"><img src="/images/logos/Futuristic%20White%20SNAPINK%20Logo.png" alt="SnapInk" width="300" height="100"></a><h1>Partner portal</h1><p>Partner production access is restricted to approved pilot partners. Sign in with the partner access code issued by SnapInk.</p><div class="box" id="access-panel"><form id="access"><label for="access-code">Partner access code</label><input id="access-code" type="password" autocomplete="one-time-code" maxlength="128" required><button id="continue" type="submit">Continue</button></form><p id="message" role="status" aria-live="polite"></p><section id="embroidery-production-sheet" data-partner-dashboard hidden><p id="partner-welcome"></p><p><a href="/wholesale">Open the protected wholesale partner portal</a></p><button id="embroidery-download" type="button">Download Embroidery Production Sheet</button><button id="logout" type="button" class="secondary">Sign out</button></section></div><p><a href="/pilot.html">Apply to become a pilot partner</a></p></main><script>
const accessForm=document.querySelector("#access"), accessPanel=document.querySelector("#access-panel"), dashboard=document.querySelector("[data-partner-dashboard]"), message=document.querySelector("#message"), downloadButton=document.querySelector("#embroidery-download");
function showPortal(partner){accessForm.hidden=true;dashboard.hidden=false;document.querySelector("#partner-welcome").textContent="Signed in as "+(partner?.businessName||"approved partner")+". Your partner tools are ready.";message.textContent="Partner access verified."}
function showLogin(error=""){dashboard.hidden=true;accessForm.hidden=false;if(error)message.textContent=error}
async function refreshSession(){try{const response=await fetch("/api/partner-portal",{credentials:"same-origin",cache:"no-store"});const data=await response.json().catch(()=>({}));if(response.ok&&data.authenticated)showPortal(data.partner);else showLogin()}catch{showLogin("Partner access is temporarily unavailable. Please try again.")}}
accessForm.addEventListener("submit",async(event)=>{event.preventDefault();const button=document.querySelector("#continue");button.disabled=true;message.textContent="Verifying access code...";try{const response=await fetch("/api/partner-portal",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",cache:"no-store",body:JSON.stringify({code:document.querySelector("#access-code").value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Access code not recognized or inactive.");document.querySelector("#access-code").value="";showPortal(data.partner)}catch(error){showLogin(error instanceof Error?error.message:"Access code not recognized or inactive.")}finally{button.disabled=false}});
document.querySelector("#logout").addEventListener("click",async()=>{await fetch("/api/partner-portal",{method:"DELETE",credentials:"same-origin",cache:"no-store"}).catch(()=>{});showLogin("You have signed out.")});
downloadButton.addEventListener("click",async()=>{downloadButton.disabled=true;message.textContent="Preparing the partner resource...";try{const response=await fetch("/api/partner-portal/embroidery-sheet",{credentials:"same-origin",cache:"no-store"});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||"The partner resource could not be downloaded.")}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="SnapInk_Embroidery_Production_Guide_Hat_Launch.pdf";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message.textContent="Partner resource downloaded."}catch(error){message.textContent=error instanceof Error?error.message:"The partner resource could not be downloaded."}finally{downloadButton.disabled=false}});
refreshSession();
</script><script defer src="/shop-nav.js"></script></body></html>
