<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><meta name="robots" content="noindex,nofollow"><title>Partner Portal | SnapInk™</title><style>body{margin:0;background:var(--si-bg);color:var(--si-text);font:16px system-ui,sans-serif}.wrap{width:min(680px,calc(100% - 36px));margin:12vh auto}.brand{display:inline-flex;align-items:center}.brand img{display:block;width:min(180px,48vw);height:auto}h1{font-size:clamp(38px,8vw,68px);line-height:.98;letter-spacing:-.05em;margin:60px 0 18px}p{color:var(--si-muted);line-height:1.7}.box{margin-top:30px;padding:24px;border:1px solid var(--si-line);background:var(--si-panel)}#embroidery-download{display:none;margin-top:12px}#embroidery-download:not([hidden]){display:inline-block}a{color:var(--si-accent)}button{display:inline-block;padding:14px 18px;background:var(--si-button);color:#fff;text-decoration:none;font-weight:700;border:0;cursor:pointer}#message{min-height:22px;color:var(--si-accent);font-size:14px}input{display:block;width:100%;box-sizing:border-box;padding:13px;background:var(--si-bg);border:1px solid var(--si-line);color:white;margin:12px 0;font:inherit}</style><link rel="stylesheet" href="/mobile-navigation.css?v=20261029-header1"><script defer src="/mobile-navigation.js"></script><link rel="stylesheet" href="/site-theme.css?v=20261029-header1"></head><body><main class="wrap"><a class="brand" href="/" aria-label="SnapInk home"><img src="/images/logos/Futuristic%20White%20SNAPINK%20Logo.png" alt="SnapInk" width="300" height="100"></a><h1>Partner portal</h1><p>Partner production access is restricted to approved pilot partners. Sign in with the access credential provided by the SnapInk team.</p><div class="box" id="embroidery-production-sheet"><form id="access"><label for="token">Partner access credential</label><input id="token" type="password" autocomplete="current-password" required><button>Verify access</button></form><p id="message" role="status" aria-live="polite"></p><button id="embroidery-download" type="button" hidden>Download Embroidery Production Sheet</button></div><p><a href="/pilot.html">Apply to become a pilot partner</a></p></main><script>
let approvedPartnerToken = "";
const accessMessage = document.querySelector("#message");
const embroideryDownload = document.querySelector("#embroidery-download");

document.querySelector("#access").addEventListener("submit", async (event) => {
  event.preventDefault();
  const token = document.querySelector("#token").value.trim();
  accessMessage.textContent = "Verifying�";
  embroideryDownload.hidden = true;
  approvedPartnerToken = "";

  try {
    const response = await fetch("/api/partner-portal", {
      headers: { Authorization: `Bearer ${token}` },
      cache: "no-store",
    });
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      throw new Error(result.error || "Access could not be verified. Contact the SnapInk team if you are an approved partner.");
    }

    approvedPartnerToken = token;
    embroideryDownload.hidden = false;
    accessMessage.textContent = "Access verified. Your approved partner resource is ready.";
  } catch (error) {
    accessMessage.textContent = error instanceof Error ? error.message : "Access could not be verified.";
  }
});

embroideryDownload.addEventListener("click", async () => {
  if (!approvedPartnerToken) return;
  embroideryDownload.disabled = true;
  accessMessage.textContent = "Preparing your production sheet�";

  try {
    const response = await fetch("/api/partner-portal/embroidery-sheet", {
      headers: { Authorization: `Bearer ${approvedPartnerToken}` },
      cache: "no-store",
    });
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      throw new Error(result.error || "The production sheet could not be downloaded.");
    }

    const file = await response.blob();
    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = "SnapInk_Embroidery_Production_Guide_Hat_Launch.pdf";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    accessMessage.textContent = "Embroidery Production Sheet downloaded.";
  } catch (error) {
    accessMessage.textContent = error instanceof Error ? error.message : "The production sheet could not be downloaded.";
  } finally {
    embroideryDownload.disabled = false;
  }
});
</script></body></html>
