# Cloudflare Pages production configuration for the existing snapink project.
name = "snapink"
pages_build_output_dir = "./dist"
compatibility_date = "2025-08-16"

[env.production]
compatibility_date = "2024-11-20"

[[env.production.d1_databases]]
binding = "DB"
database_name = "snapink_waitlist"
database_id = "9263527d-7f81-4277-a171-e20b364f918c"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "PRIVATE_ASSETS"
bucket_name = "snapink-private-assets"

[env.production.vars]
RETAIL_ORDERS_ENABLED = "true"
SHOP_ORDERS_ENABLED = "false"
RETAIL_PAYMENT_LINKS_ENABLED = "false"
STRIPE_AUTOMATIC_TAX_ENABLED = "false"
